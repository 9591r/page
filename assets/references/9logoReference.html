<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon 9 Plexus Model</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #060e1a;
        }
        canvas { 
            display: block; 
        }
    </style>
</head>
<body>
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { FontLoader } from 'three/addons/loaders/FontLoader.js';
        import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x060e1a, 0.002);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
        camera.position.set(0, 0, 150);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.5;

        const loader = new FontLoader();
        
        loader.load('https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json', function (font) {
            
            const geometry = new TextGeometry('9', {
                font: font,
                size: 50,
                height: 5, // Reduced depth
                curveSegments: 2, 
                bevelEnabled: true,
                bevelThickness: 3,
                bevelSize: 1.5,
                bevelOffset: 0,
                bevelSegments: 2
            });
            geometry.center();

            const group = new THREE.Group();

            const coreMaterial = new THREE.MeshBasicMaterial({
                color: 0x112244,
                transparent: true,
                opacity: 0.2, // Increased transparency
                blending: THREE.AdditiveBlending,
                wireframe: false
            });
            const coreMesh = new THREE.Mesh(geometry, coreMaterial);
            group.add(coreMesh);

            const wireframeGeometry = new THREE.WireframeGeometry(geometry);
            const wireframeMaterial = new THREE.LineBasicMaterial({
                color: 0x00ffff,
                transparent: true,
                opacity: 0.15, // Increased transparency
                blending: THREE.AdditiveBlending
            });
            const wireframe = new THREE.LineSegments(wireframeGeometry, wireframeMaterial);
            group.add(wireframe);

            const pointsMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 1.5,
                transparent: true,
                opacity: 0.5, // Increased transparency
                blending: THREE.AdditiveBlending
            });
            const points = new THREE.Points(geometry, pointsMaterial);
            group.add(points);

            scene.add(group);
        });

        const particlesGeometry = new THREE.BufferGeometry();
        const particleCount = 800;
        const posArray = new Float32Array(particleCount * 3);

        for(let i = 0; i < particleCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 400;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.8,
            color: 0x44aaff,
            transparent: true,
            opacity: 0.3, // Increased transparency
            blending: THREE.AdditiveBlending
        });
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        
        bloomPass.threshold = 0.1;
        bloomPass.strength = 0.6; // Reduced brightness
        bloomPass.radius = 0.8;

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            
            particlesMesh.rotation.y += 0.0005;
            particlesMesh.rotation.x += 0.0002;

            composer.render();
        }
        
        animate();
    </script>
</body>
</html>
