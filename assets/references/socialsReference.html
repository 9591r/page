<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Neon Plexus Models</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #060e1a; 
        }
        canvas { 
            display: block; 
        }
    </style>
</head>
<body>
    <!-- Import maps polyfill -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // 1. Scene Setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x060e1a, 0.0015);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
        camera.position.set(0, 0, 220);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.8;

        // 2. Geometry & Materials with Customized Mesh Density and Transparency
        const loader = new SVGLoader();

        const logos = [
            {
                name: 'YouTube', color: 0xFF0000, pos: [-60, 30, 0], scale: 1.4, dense: true,
                svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M21.582,6.057c-0.27-1.12-1.182-1.92-2.316-1.92C16.896,4,12,4,12,4s-4.896,0-7.266,0.137C3.598,4.137,2.686,4.937,2.416,6.057C2,8.196,2,12,2,12s0,3.804,0.416,5.943c0.27,1.12,1.182,1.92,2.316,1.92C7.104,20,12,20,12,20s4.896,0,7.266-0.137c1.134-0.001,2.045-0.801,2.316-1.92C22,15.804,22,12,22,12S22,8.196,21.582,6.057z M10,15.464V8.536L16,12L10,15.464z"/></svg>'
            },
            {
                name: 'Instagram', color: 0xE1306C, pos: [0, 30, 0], scale: 1.4, dense: false,
                svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M7.8,2H16.2C19.4,2 22,4.6 22,7.8V16.2A5.8,5.8 0 0,1 16.2,22H7.8C4.6,22 2,19.4 2,16.2V7.8A5.8,5.8 0 0,1 7.8,2M7.6,4A3.6,3.6 0 0,0 4,7.6V16.4C4,18.39 5.61,20 7.6,20H16.4A3.6,3.6 0 0,0 20,16.4V7.6C20,5.61 18.39,4 16.4,4H7.6M17.25,5.5A1.25,1.25 0 0,1 18.5,6.75A1.25,1.25 0 0,1 17.25,8A1.25,1.25 0 0,1 16,6.75A1.25,1.25 0 0,1 17.25,5.5M12,7A5,5 0 0,1 17,12A5,5 0 0,1 12,17A5,5 0 0,1 7,12A5,5 0 0,1 12,7M12,9A3,3 0 0,0 9,12A3,3 0 0,0 12,15A3,3 0 0,0 15,12A3,3 0 0,0 12,9Z"/></svg>'
            },
            {
                name: 'LinkedIn', color: 0x0A66C2, pos: [60, 30, 0], scale: 1.4, dense: false,
                svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M19,3A2,2 0 0,1 21,5V19A2,2 0 0,1 19,21H5A2,2 0 0,1 3,19V5A2,2 0 0,1 5,3H19M18.5,18.5V13.2A3.26,3.26 0 0,0 15.24,9.94C14.39,9.94 13.4,10.46 12.92,11.24V10.13H10.13V18.5H12.92V13.57C12.92,12.8 13.54,12.17 14.31,12.17A1.4,1.4 0 0,1 15.71,13.57V18.5H18.5M6.88,8.56A1.68,1.68 0 0,0 8.56,6.88C8.56,5.95 7.81,5.19 6.88,5.19A1.69,1.69 0 0,0 5.19,6.88C5.19,7.81 5.95,8.56 6.88,8.56M8.27,18.5V10.13H5.5V18.5H8.27Z"/></svg>'
            },
            {
                name: 'GitHub', color: 0xFFFFFF, pos: [-75, -20, 0], scale: 1.4, dense: true,
                svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12,2A10,10 0 0,0 2,12C2,16.42 4.87,20.17 8.84,21.5C9.34,21.58 9.5,21.27 9.5,21V19.31C6.73,19.91 6.14,17.97 6.14,17.97C5.68,16.81 5.03,16.5 5.03,16.5C4.12,15.88 5.1,15.9 5.1,15.9C6.1,15.97 6.63,16.93 6.63,16.93C7.5,18.45 8.97,18 9.54,17.76C9.63,17.11 9.89,16.67 10.17,16.42C7.95,16.17 5.62,15.31 5.62,11.5C5.62,10.39 6,9.5 6.65,8.79C6.55,8.54 6.2,7.5 6.75,6.15C6.75,6.15 7.59,5.88 9.5,7.17C10.29,6.95 11.15,6.84 12,6.84C12.85,6.84 13.71,6.95 14.5,7.17C16.41,5.88 17.25,6.15 17.25,6.15C17.8,7.5 17.45,8.54 17.35,8.79C18,9.5 18.38,10.39 18.38,11.5C18.38,15.32 16.04,16.16 13.81,16.41C14.17,16.72 14.5,17.33 14.5,18.26V21C14.5,21.27 14.66,21.59 15.17,21.5C19.14,20.16 22,16.42 22,12A10,10 0 0,0 12,2Z"/></svg>'
            },
            {
                name: 'Facebook', color: 0x1877F2, pos: [-25, -20, 0], scale: 1.4, dense: false,
                svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M19,4V7H17A1,1 0 0,0 16,8V10H19V13H16V20H13V13H11V10H13V7.5C13,5.56 14.57,4 16.5,4C17.33,4 18.16,4.14 19,4Z"/></svg>'
            },
            {
                name: 'X', color: 0xFFFFFF, pos: [25, -20, 0], scale: 1.4, dense: true,
                svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/></svg>'
            },
            {
                name: 'Twitch', color: 0x9146FF, pos: [75, -20, 0], scale: 1.4, dense: false,
                svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M11.64 5.93h1.43v4.28h-1.43m3.93-4.28H17v4.28h-1.43M7 2L3.43 5.57v12.86h4.28V22l3.58-3.57h2.85L20.57 12V2m-1.43 9.29l-2.85 2.85h-2.86l-2.5 2.5v-2.5H7.71V3.43h11.43Z"/></svg>'
            }
        ];

        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        logos.forEach(logo => {
            const svgData = loader.parse(logo.svg);
            const logoGroup = new THREE.Group();

            svgData.paths.forEach(path => {
                const shapes = SVGLoader.createShapes(path);

                shapes.forEach(shape => {
                    // Significantly higher segment counts for YouTube, GitHub, and X
                    const geometry = new THREE.ExtrudeGeometry(shape, {
                        depth: 2.5,
                        bevelEnabled: true,
                        bevelThickness: 0.8,
                        bevelSize: 0.4,
                        bevelSegments: logo.dense ? 5 : 1,
                        curveSegments: logo.dense ? 16 : 2
                    });

                    geometry.center();

                    // Increased transparency for core and wireframe on target logos
                    const coreMaterial = new THREE.MeshBasicMaterial({
                        color: logo.color,
                        transparent: true,
                        opacity: logo.dense ? 0.05 : 0.2,
                        blending: THREE.AdditiveBlending
                    });
                    const coreMesh = new THREE.Mesh(geometry, coreMaterial);
                    logoGroup.add(coreMesh);

                    const wireframeGeometry = new THREE.WireframeGeometry(geometry);
                    const wireframeMaterial = new THREE.LineBasicMaterial({
                        color: logo.color,
                        transparent: true,
                        opacity: logo.dense ? 0.35 : 0.7,
                        blending: THREE.AdditiveBlending
                    });
                    const wireframe = new THREE.LineSegments(wireframeGeometry, wireframeMaterial);
                    logoGroup.add(wireframe);

                    // Dimmed node light points across all meshes (lower opacity and size)
                    const pointsMaterial = new THREE.PointsMaterial({
                        color: 0xffffff,
                        size: 0.5,
                        transparent: true,
                        opacity: logo.dense ? 0.25 : 0.4,
                        blending: THREE.AdditiveBlending
                    });
                    const points = new THREE.Points(geometry, pointsMaterial);
                    logoGroup.add(points);
                });
            });

            logoGroup.rotation.x = Math.PI; 
            logoGroup.position.set(logo.pos[0], logo.pos[1], logo.pos[2]);
            logoGroup.scale.set(logo.scale, logo.scale, logo.scale);

            mainGroup.add(logoGroup);
        });

        new THREE.Box3().setFromObject(mainGroup).getCenter(mainGroup.position).multiplyScalar(-1);

        // 3. Background Ambient Particles
        const particlesGeometry = new THREE.BufferGeometry();
        const particleCount = 1000;
        const posArray = new Float32Array(particleCount * 3);

        for(let i = 0; i < particleCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 600; 
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.8,
            color: 0x44aaff,
            transparent: true,
            opacity: 0.3,
            blending: THREE.AdditiveBlending
        });
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        // 4. Post-processing: Softened UnrealBloomPass settings for reduced point flare
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.4, 0.85);
        
        bloomPass.threshold = 0.2;
        bloomPass.strength = 1.1;
        bloomPass.radius = 0.5;

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // 5. Window Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // 6. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            
            particlesMesh.rotation.y += 0.0003;
            particlesMesh.rotation.x += 0.0001;

            composer.render();
        }
        
        animate();
    </script>
</body>
</html>
